<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Vault</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-top: 20px;
        }

        .list-box {
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
            background: #fafafa;
        }

        .list-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

            .list-item:hover {
                background: #eef2f7;
            }

            .list-item.active {
                background: #3498db;
                color: white;
            }

        .viewer-box {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            background: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .viewer-title {
            font-weight: bold;
            font-size: 18px;
        }

        .copy-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

            .copy-btn:hover {
                background-color: #27ae60;
            }

        pre {
            background: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            margin: 0;
            flex-grow: 1;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .placeholder-text {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Data & Document Vault</h1>

        <div class="form-group">
            <label for="folderSelect">Choose a Main Folder:</label>
            <select id="folderSelect" onchange="loadSubitems()">
                <option value="">-- Odaberi projekat --</option>
            </select>
        </div>

        <div class="layout">
            <div>
                <label>Subitems:</label>
                <div id="subitemList" class="list-box">
                    <div class="placeholder-text" style="margin-top: 20px;">Select a folder first</div>
                </div>
            </div>

            <div>
                <label>Content View:</label>
                <div class="viewer-box">
                    <div class="viewer-header">
                        <span id="viewerTitle" class="viewer-title">No item selected</span>
                        <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()" style="display: none;">Copy Text</button>
                    </div>
                    <div id="contentContainer">
                        <p class="placeholder-text">Select an item from the list to view its contents.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app-data.js"></script>

    <script>
    let currentTextToCopy = "";

    // Initialize the folder dropdown using data from app-data.js
    const folderSelect = document.getElementById("folderSelect");
    for (const folderName in dataStructure) {
        let option = document.createElement("option");
        option.value = folderName;
        option.textContent = folderName;
        folderSelect.appendChild(option);
    }

    function loadSubitems() {
        const folderName = folderSelect.value;
        const subitemList = document.getElementById("subitemList");
        resetViewer();

        if (!folderName) {
            subitemList.innerHTML = '<div class="placeholder-text" style="margin-top: 20px;">Select a folder first</div>';
            return;
        }

        subitemList.innerHTML = "";
        const items = dataStructure[folderName];

        items.forEach((item) => {
            let div = document.createElement("div");
            div.className = "list-item";
            div.textContent = item.name;
            div.onclick = function() {
                document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                displayContent(item.name, item.content);
            };
            subitemList.appendChild(div);
        });
    }

    function displayContent(title, content) {
        document.getElementById("viewerTitle").textContent = title;
        document.getElementById("contentContainer").innerHTML = `<pre id="textContent"></pre>`;
        document.getElementById("textContent").textContent = content;

        currentTextToCopy = content;
        document.getElementById("copyBtn").style.display = "block";
        document.getElementById("copyBtn").textContent = "Copy Text";
    }

    function resetViewer() {
        document.getElementById("viewerTitle").textContent = "No item selected";
        document.getElementById("contentContainer").innerHTML = `<p class="placeholder-text">Select an item from the list to view its contents.</p>`;
        document.getElementById("copyBtn").style.display = "none";
        currentTextToCopy = "";
    }

    function copyToClipboard() {
        if (!currentTextToCopy) return;
        navigator.clipboard.writeText(currentTextToCopy).then(() => {
            const copyBtn = document.getElementById("copyBtn");
            copyBtn.textContent = "Copied!";
            setTimeout(() => { copyBtn.textContent = "Copy Text"; }, 2000);
        });
    }
    </script>

</body>
</html>
